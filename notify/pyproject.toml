[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notify"
version = "0.1.0"
description = "Multi-channel notification library (email, SMS, WhatsApp) built around a factory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whatsapp = ["pywhatkit>=5.4"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
